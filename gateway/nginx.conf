# Single entry point (port 8080). Routes by path to each micro-frontend / microservice.
# Docker's DNS resolver lets nginx start even if a service is down, and re-resolve
# container IPs when they are recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  client_max_body_size 2g;

  # HTTP/1.1 to upstreams (nginx defaults to 1.0) + websocket upgrade support
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ---------- backend microservices ----------
  location /api/auth/ {
    set $up auth-service:8081;
    proxy_pass http://$up;
  }
  location /api/catalog/ {
    set $up catalog-service:3000;
    proxy_pass http://$up;
  }
  location /api/media/ {
    set $up media-service:8000;
    proxy_request_buffering off;     # stream big uploads straight to Django
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://$up;
  }
  location /api/watchlist/ {
    set $up watchlist-service:8080;
    proxy_pass http://$up;
  }

  # ---------- object storage (MinIO, public-read bucket) ----------
  # Range requests are passed through, so the <video> tag can seek.
  location /netflix-media/ {
    set $up minio:9000;
    proxy_buffering off;
    proxy_pass http://$up;
  }

  # ---------- micro-frontends ----------
  location /mfe/auth/ {
    set $up mfe-auth:80;
    rewrite ^/mfe/auth/(.*)$ /$1 break;
    proxy_pass http://$up;
  }
  location /mfe/browse/ {
    set $up mfe-browse:80;
    rewrite ^/mfe/browse/(.*)$ /$1 break;
    proxy_pass http://$up;
  }
  location /studio {
    set $up studio:3000;
    proxy_pass http://$up;
  }
  location / {
    set $up shell:80;
    proxy_pass http://$up;
  }

  location = /gateway/health {
    access_log off;
    return 200 '{"status":"ok","service":"gateway"}';
    default_type application/json;
  }
}
